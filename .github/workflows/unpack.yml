name: Publish Chronos source
on:
  push:
    paths:
      - source/chronos-source.b64
      - tools/unpack.py
      - .github/workflows/unpack.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install brotli
      - run: python tools/unpack.py
      - name: Commit unpacked project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish full Chronos application source"
            git push origin HEAD:main
          fi
